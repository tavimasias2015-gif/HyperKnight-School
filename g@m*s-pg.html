<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:url('https://i.pinimg.com/originals/e2/8d/61/e28d61b0ce1b686bbd9c19b98912101f.gif');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.overlay{
    min-height:100vh;
    background:rgba(0,0,0,0.55);
    padding:40px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:40px;
    font-size:3rem;
    text-shadow:0 0 20px #000;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
}

.card{
    width:155px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:170px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.card-content h2{
    color:white;
    margin-bottom:10px;
}

.card-content p{
    color:#ddd;
    margin-bottom:15px;
}

.card-content a{
    display:inline-block;
    padding:10px 20px;
    background:#00bfff;
    color:white;
    text-decoration:none;
    border-radius:8px;
    transition:0.3s;
}

.card-content a:hover{
    background:#0095cc;
}
</style>
