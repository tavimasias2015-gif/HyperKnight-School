<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#050816;
    color:white;
    min-height:100vh;
}

/* Header */
.header{
    text-align:center;
    padding:30px;
}

.logo{
    font-size:2.8rem;
    font-weight:900;
    color:white;
    text-shadow:
        0 0 10px #00bfff,
        0 0 20px #00bfff,
        0 0 40px #00bfff;
}

/* Search */
.search-container{
    display:flex;
    justify-content:center;
    margin:20px;
}

#search{
    width:400px;
    max-width:90%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#0f1830;
    color:white;
    outline:none;
    font-size:16px;
    border:1px solid #00bfff;
    box-shadow:0 0 15px rgba(0,191,255,.4);
}

/* Games Grid */
.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:25px;
    padding:30px;
}

/* Game Card */
.game-card{
    background:#0b1327;
    border:1px solid rgba(0,191,255,.3);
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 10px rgba(0,191,255,.2);
}

.game-card:hover{
    transform:translateY(-8px);
    box-shadow:
        0 0 20px #00bfff,
        0 0 40px rgba(0,191,255,.5);
}

.game-image{
    width:100%;
    height:150px;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#666;
}

.game-name{
    padding:15px;
    text-align:center;
    font-weight:bold;
}

/* Hidden cards */
.hidden{
    display:none;
}

    /* Background Glow */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,191,255,.18), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(0,191,255,.12), transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(0,191,255,.15), transparent 45%);
    filter:blur(50px);
}

/* Particle Layer */
#particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.particle{
    position:absolute;
    border-radius:50%;
    background:#00bfff;
    box-shadow:
        0 0 6px #00bfff,
        0 0 12px #00bfff,
        0 0 20px rgba(0,191,255,.8);
    opacity:.7;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-120px);
    }
}
    
</style>
</head>
<body>

    <div id="particles"></div>

<div class="header">
    <div class="logo">HyperKnight School</div>
</div>

<div class="search-container">
    <input
        type="text"
        id="search"
        placeholder="Search games..."
    >
</div>

<div class="games-grid" id="gamesGrid">

    <!-- TEMPLATE CARD -->

<div class="game-card" data-name="Drive Mad" data-url="g@m*s/drive-mad.html">
    <img class="game-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRQweyLDiaCsOfymxUHhScRfxoPKYMjtqbXtW55IfR9ew&s=10" alt="">
    <div class="game-name">Drive Mad</div>
</div>

<div class="game-card" data-name="1v1.lol" data-url="g@m*s/1v1-lol.html">
    <img class="game-image" src="https://iogamesweb.com/thumb/1v1_LOL.webp" alt="">
    <div class="game-name">1v1.lol</div>
</div>

    <div class="game-card" data-name="Minecraft" data-url="minecraft.html">
    <img class="game-image" src="minecraft.jpg" alt="">
    <div class="game-name">Minecraft</div>
</div>

<div class="game-card" data-name="Slope" data-url="slope.html">
    <img class="game-image" src="slope.jpg" alt="">
    <div class="game-name">Slope</div>
</div>

<div class="game-card" data-name="Minecraft" data-url="minecraft.html">
    <img class="game-image" src="minecraft.jpg" alt="">
    <div class="game-name">Minecraft</div>
</div>

<div class="game-card" data-name="Slope" data-url="slope.html">
    <img class="game-image" src="slope.jpg" alt="">
    <div class="game-name">Slope</div>
</div>

<div class="game-card" data-name="Minecraft" data-url="minecraft.html">
    <img class="game-image" src="minecraft.jpg" alt="">
    <div class="game-name">Minecraft</div>
</div>

<div class="game-card" data-name="Slope" data-url="slope.html">
    <img class="game-image" src="slope.jpg" alt="">
    <div class="game-name">Slope</div>
</div>

<script>
const searchInput = document.getElementById("search");
const cards = document.querySelectorAll(".game-card");

function fuzzyMatch(text, query) {
    text = text.toLowerCase();
    query = query.toLowerCase();

    let i = 0;

    for (let char of text) {
        if (char === query[i]) i++;
        if (i === query.length) return true;
    }

    return false;
}

searchInput.addEventListener("input", () => {
    const search = searchInput.value.trim();

    cards.forEach(card => {
        const name = card.dataset.name;

        if (
            search === "" ||
            name.toLowerCase().includes(search.toLowerCase()) ||
            fuzzyMatch(name, search)
        ) {
            card.classList.remove("hidden");
        } else {
            card.classList.add("hidden");
        }
    });
});

    /* Floating Blue Particles */
const particleContainer = document.getElementById("particles");

for(let i = 0; i < 60; i++){

    const particle = document.createElement("div");
    particle.classList.add("particle");

    const size = Math.random() * 4 + 2;
    const left = Math.random() * 100;
    const duration = Math.random() * 15 + 10;
    const delay = Math.random() * -20;

    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.left = left + "%";
    particle.style.animationDuration = duration + "s";
    particle.style.animationDelay = delay + "s";

    particleContainer.appendChild(particle);
}

    cards.forEach(card => {
    card.addEventListener("click", () => {
        const url = card.dataset.url;
        if (url) {
            window.location.href = url;
        }
    });
});
    
</script>

</body>
</html>
