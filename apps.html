
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

body {
    background: #050816;
    color: white;
    overflow-x: hidden;
    min-height: 100vh;
}

/* BACKGROUND GRID */
.grid {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,255,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.08) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 15s linear infinite;
    z-index: 0;
    pointer-events: none;
}

@keyframes gridMove {
    from { transform: translateY(0); }
    to { transform: translateY(40px); }
}

/* BACKGROUND GLOW */
.glow1, .glow2 {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: 0;
    pointer-events: none;
}

.glow1 {
    width: 400px;
    height: 400px;
    background: #00ffff;
    top: -150px;
    left: -150px;
    opacity: .4;
}

.glow2 {
    width: 400px;
    height: 400px;
    background: #a855f7;
    bottom: -150px;
    right: -150px;
    opacity: .4;
}

/* CONTENT */
.content {
    position: relative;
    z-index: 2;
    max-width: 1600px;
    margin: auto;
    padding: 40px 20px 180px;
}

.title {
    text-align: center;
    font-size: 3rem;
    color: #00ffff;
    text-shadow: 0 0 20px #00ffff;
    margin-bottom: 20px;
}

/* SEARCH */
.search-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

#searchInput {
    width: 100%;
    max-width: 500px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 2px solid rgba(0,255,255,.3);
    background: rgba(0,0,0,.4);
    color: #00ffff;
    outline: none;
    box-shadow: 0 0 10px rgba(0,255,255,.15);
}

#searchInput:focus {
    border-color: #00ffff;
    box-shadow: 0 0 25px #00ffff;
}

/* GAMES GRID */
.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 18px;
    align-items: stretch;
}

/* GAME CARD */
.game-card {
    position: relative;
    display: block;
    width: 100%;
    height: 230px;
    min-width: 0;

    text-decoration: none;
    color: white;
    background: #050816;
    border: 2px solid rgba(0,255,255,.3);
    border-radius: 12px;
    overflow: hidden;

    transition: transform .25s, border-color .25s, box-shadow .25s;
    box-shadow: 0 0 10px rgba(0,255,255,.1);
}

.game-card:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: #00ffff;
    box-shadow: 0 0 25px #00ffff;
}

/* IMAGE FILLS ENTIRE CARD */
.game-image {
    position: absolute;
    inset: 0;

    display: block;
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    transition: transform .3s;
}

.game-card:hover .game-image {
    transform: scale(1.05);
}

/* TITLE OVERLAY */
.game-info {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;

    padding: 12px 8px;
    text-align: center;
    font-size: .9rem;
    color: #00ffff;

    background: linear-gradient(
        transparent,
        rgba(0,0,0,.85) 35%,
        rgba(0,0,0,.95)
    );

    overflow-wrap: anywhere;
    z-index: 1;
}

/* BOTTOM NAVIGATION */
.bottom-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 750px;
    height: 95px;
    z-index: 9999;

    background: rgba(0,0,0,.75);
    backdrop-filter: blur(20px);
    border: 2px solid #00ffff;
    box-shadow: 0 0 20px #00ffff;
    border-radius: 20px;

    display: flex;
    justify-content: space-evenly;
    align-items: center;
}

.bottom-nav button {
    width: 70px;
    height: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.4);
    border: 2px solid rgba(0,255,255,.25);
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
}

.bottom-nav button:hover {
    color: #00ffff;
    box-shadow: 0 0 15px #00ffff;
}

.active {
    background: #00ffff;
    color: #050816 !important;
}

/* PARTICLES */
.particle {
    position: fixed;
    border-radius: 50%;
    animation: float linear infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes float {
    from {
        transform: translateY(0);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    to {
        transform: translateY(-120vh);
        opacity: 0;
    }
}

/* MOBILE */
@media (max-width: 480px) {
    .content {
        padding: 25px 12px 150px;
    }

    .title {
        font-size: 2.2rem;
    }

    .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .game-card {
        height: 200px;
    }

    .game-info {
        font-size: .75rem;
        padding: 10px 5px;
    }

    .bottom-nav {
        width: 96%;
        height: 78px;
        bottom: 10px;
    }

    .bottom-nav button {
        width: 18%;
        height: 58px;
        font-size: .65rem;
    }

    .bottom-nav small {
        font-size: .5rem;
    }
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="glow1"></div>
<div class="glow2"></div>

<div class="content">

    <h1 class="title">G@M*S</h1>

    <div class="search-wrap">
        <input
            id="searchInput"
            type="text"
            placeholder="Search g@m*s..."
            autocomplete="off"
        >
    </div>

    <div class="games-grid" id="games">

        <a href="apps/cloudmoon.html"
           class="game-card"
           data-name="cloudmoon">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1W9DtwhyHaahKOOpQOc6Qxb52e2zQPILlbWNYIAq7xA&s=10"
                class="game-image"
                alt="Cloudmoon"
            >

            <div class="game-info">Cloudmoon</div>
        </a>

        <a href="apps/ai.html"
           class="game-card"
           data-name="ai">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFhgbMXZFIV45W8pOK_Ij0dAhF4uyCmKlNLdbExmWNww&s=10"
                class="game-image"
                alt="AI"
            >

            <div class="game-info">AI</div>
        </a>

        <a href="apps/soundboard.html"
           class="game-card"
           data-name="soundboard">

            <img
                src="https://res.xc.com/res/cover/2x/30370.webp"
                class="game-image"
                alt="Soundboard"
            >

            <div class="game-info">Soundboard</div>
        </a>

    </div>
</div>

<!-- BOTTOM NAVIGATION -->
<div class="bottom-nav">

<button onclick="location.href='index.html'">
        <span></span>
        <small>HOME</small>
    </button>

    <button onclick="location.href='g@m*s-pg.html'">
        <span></span>
        <small>G@M*S</small>
    </button>

    <button onclick="location.href='ch@t.html'">
        <span></span>
        <small>CH@T</small>
    </button>

    <button onclick="location.href='apps.html'">
        <span></span>
        <small>APPS</small>
    </button>

    <button onclick="location.href='settings.html'">
        <span></span>
        <small>SETTINGS</small>
    </button>

</div>

<!-- CLICK SOUND -->
<audio
    id="clickSound"
    src="https://www.soundjay.com/buttons/sounds/button-16.mp3"
    preload="auto"
></audio>

<script>
/* PARTICLES */
for (let i = 0; i < 120; i++) {
    const p = document.createElement("div");
    p.className = "particle";

    const size = Math.random() * 4 + 2;

    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.left = Math.random() * 100 + "%";
    p.style.bottom = "-10px";

    const colors = ["#00ffff", "#a855f7", "#ffffff"];
    const color = colors[Math.floor(Math.random() * colors.length)];

    p.style.background = color;
    p.style.boxShadow = `0 0 10px ${color}`;
    p.style.animation = `float ${Math.random() * 10 + 8}s linear infinite`;
    p.style.animationDelay = `-${Math.random() * 15}s`;

    document.body.appendChild(p);
}

/* GAME CARDS */
const clickSound = document.getElementById("clickSound");
const grid = document.getElementById("games");
const cards = Array.from(document.querySelectorAll(".game-card"));
const input = document.getElementById("searchInput");

/* PLAY COUNTS */
function getCount(name) {
    return parseInt(localStorage.getItem("play_" + name) || "0", 10);
}

/* SORT BY MOST PLAYED */
function sortGames() {
    const sortedCards = [...cards].sort((a, b) => {
        return getCount(b.dataset.name) - getCount(a.dataset.name);
    });

    sortedCards.forEach(card => grid.appendChild(card));
}

sortGames();

/* TRACK CLICKS */
cards.forEach(card => {
    card.addEventListener("click", () => {
        clickSound.currentTime = 0;

        const soundPromise = clickSound.play();

        if (soundPromise) {
            soundPromise.catch(() => {});
        }

        const name = card.dataset.name;
        const count = getCount(name) + 1;

        localStorage.setItem("play_" + name, count);
    });
});

/* FUZZY SEARCH */
function fuzzy(text, search) {
    text = text.toLowerCase();
    search = search.toLowerCase();

    let i = 0;
    let j = 0;

    while (i < text.length && j < search.length) {
        if (text[i] === search[j]) {
            j++;
        }
        i++;
    }

    return j === search.length;
}

input.addEventListener("input", () => {
    const value = input.value.trim();

    cards.forEach(card => {
        const name = card.dataset.name;
        const title = card.querySelector(".game-info").textContent;

        const matches =
            value === "" ||
            fuzzy(name, value) ||
            fuzzy(title, value);

        card.style.display = matches ? "block" : "none";
    });
});
</script>

</body>
</html>
