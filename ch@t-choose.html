<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f4c81, #1976d2, #42a5f5);
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      width: 350px;
    }

    h1 {
      color: white;
      margin-bottom: 35px;
      font-size: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #2196f3;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #1565c0;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Select Chat</h1>

    <button class="btn" onclick="goTo('ch@t.html')">
      Chat 1
    </button>

    <button class="btn" onclick="goTo('ch@t-2.html')">
      Chat 2
    </button>
  </div>

  <script>
    function goTo(destination) {
      window.location.href = destination;
    }
  </script>

</body>
</html>
