<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

body{
    background:#050816;
    height:100vh;
    overflow:hidden;
    color:white;
    position:relative;
}

/* Neon Grid */
.grid{
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,255,255,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,.08) 1px, transparent 1px);
    background-size:40px 40px;
    animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(40px);}
}

/* Glow Blobs */
.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
}

.glow1{
    width:400px;
    height:400px;
    background:#00ffff;
    top:-150px;
    left:-150px;
    opacity:.5;
}

.glow2{
    width:400px;
    height:400px;
    background:#a855f7;
    bottom:-150px;
    right:-150px;
    opacity:.5;
}

/* Main Content */
.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.logo{
    font-size:5rem;
    font-weight:900;
    color:#00ffff;
    text-transform:uppercase;

    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 80px #00ffff;

    animation:pulse 2s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.05);
    }
}

.subtitle{
    margin-top:20px;
    color:#d8b4fe;
    letter-spacing:4px;
    text-shadow:0 0 10px #a855f7;
}

/* Floating Particles */
.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
}

.particle{
    position:absolute;
    border-radius:50%;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

/* Bottom Nav */
.bottom-nav{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);

    width:90%;
    max-width:750px;
    height:95px;

    background:rgba(0,0,0,.45);
    border:2px solid #00ffff;

    box-shadow:
        0 0 15px #00ffff,
        inset 0 0 15px rgba(0,255,255,.3);

    backdrop-filter:blur(15px);
    border-radius:20px;

    display:flex;
    justify-content:space-evenly;
    align-items:center;

    z-index:5;
}

.bottom-nav button{
    width:70px;
    height:70px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.4);
    border:2px solid rgba(0,255,255,.25);

    color:white;
    cursor:pointer;

    border-radius:8px;
    transition:all .25s ease;

    box-shadow:
        0 0 10px rgba(0,255,255,.15),
        inset 0 0 10px rgba(0,255,255,.08);
}

.bottom-nav button span{
    font-size:1.5rem;
}

.bottom-nav button small{
    margin-top:4px;
    font-size:.65rem;
    letter-spacing:1px;
}

.bottom-nav button:hover{
    transform:translateY(-4px);

    color:#00ffff;
    border-color:#00ffff;

    box-shadow:
        0 0 15px #00ffff,
        0 0 30px rgba(0,255,255,.5),
        inset 0 0 10px rgba(0,255,255,.3);
}

.active{
    background:#00ffff !important;
    color:#050816 !important;

    border-color:#00ffff;

    box-shadow:
        0 0 20px #00ffff,
        0 0 40px #00ffff,
        0 0 60px rgba(0,255,255,.7);
}
</style>
</head>
<body>

<div class="grid"></div>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="particles" id="particles"></div>

<div class="container">
    <h1 class="logo">HyperKnight School</h1>
    <p class="subtitle">UNBL0CKED • G@M*S • HUB</p>
</div>

<div class="bottom-nav">

    <button onclick="location.href='index.html'">
        <span></span>
        <small>HOME</small>
    </button>

    <button onclick="location.href='g@m*s-pg.html'">
        <span></span>
        <small>G@M*S</small>
    </button>

    <button onclick="location.href='ch@t-choose.html'">
        <span></span>
        <small>CH@T</small>
    </button>

    <button onclick="location.href='saved.html'">
        <span></span>
        <small>Y0UTUB*</small>
    </button>

    <button onclick="location.href='settings.html'">
        <span></span>
        <small>SETTINGS</small>
    </button>

</div>

<script>
const container = document.getElementById("particles");

for(let i = 0; i < 120; i++){

    const p = document.createElement("div");
    p.className = "particle";

    const size = Math.random() * 4 + 2;

    p.style.width = size + "px";
    p.style.height = size + "px";

    p.style.left = Math.random() * 100 + "%";
    p.style.bottom = "-10px";

    const colors = [
        "#00ffff",
        "#00bfff",
        "#a855f7",
        "#ffffff"
    ];

    const color =
        colors[Math.floor(Math.random() * colors.length)];

    p.style.background = color;
    p.style.boxShadow = `0 0 15px ${color}`;

    p.style.animationDuration =
        (Math.random() * 10 + 8) + "s";

    p.style.animationDelay =
        Math.random() * 8 + "s";

    container.appendChild(p);
}
</script>

</body>
</html>
