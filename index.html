<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperKnight School</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: radial-gradient(circle at center, #0f2c5a, #050816);
    height:100vh;
    overflow:hidden;
    color:white;
}

/* Background Glow */
body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#00aeff;
    filter:blur(180px);
    opacity:.25;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* Center Logo */
.logo-container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-60%);
    text-align:center;
    z-index:2;
}

.logo{
    font-size:4rem;
    font-weight:900;
    color:#fff;
    text-shadow:
        0 0 10px #00bfff,
        0 0 20px #00bfff,
        0 0 40px #00bfff,
        0 0 80px #00bfff;
    letter-spacing:3px;
}

.subtitle{
    margin-top:15px;
    color:#9edcff;
    font-size:1.1rem;
    letter-spacing:4px;
}

/* Bottom Navigation */
.bottom-bar{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    padding:15px 25px;
    background:rgba(0,20,50,.6);
    border:1px solid rgba(0,191,255,.4);
    backdrop-filter:blur(12px);
    border-radius:25px;
    box-shadow:
        0 0 20px rgba(0,191,255,.5);
    z-index:5;
}

/* Square Buttons */
.nav-btn{
    width:70px;
    height:70px;
    border:none;
    border-radius:18px;
    background:rgba(0,191,255,.15);
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    border:1px solid rgba(0,191,255,.4);
    box-shadow:0 0 10px rgba(0,191,255,.3);
}

.nav-btn:hover{
    transform:translateY(-8px) scale(1.08);
    background:#00bfff;
    box-shadow:
        0 0 15px #00bfff,
        0 0 35px #00bfff;
}

/* Small floating particles */
.particle{
    position:absolute;
    background:#00bfff;
    border-radius:50%;
    opacity:.5;
    animation:float 10s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}
</style>
</head>
<body>

<div class="logo-container">
   <a href="index.html" class="logo-link">
    <div class="logo">HyperKnight School</div>
</a>
    <div class="subtitle">UNBLOCKED G@M*NG HUB</div>
</div>

<div class="bottom-bar">
    <button class="nav-btn" onclick="location.href='g@m*s-pg.html'">G@m*s</button>
    <button class="nav-btn" onclick="location.href='apps.html'">Apps</button>
    <button class="nav-btn" onclick="location.href='proxy.html'">Pro*y</button>
    <button class="nav-btn" onclick="location.href='settings.html'">Settings</button>
</div>
    
<script>
// Floating particles
for(let i=0;i<25;i++){
    let p=document.createElement('div');
    p.classList.add('particle');

    let size=Math.random()*6+2;

    p.style.width=size+'px';
    p.style.height=size+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.animationDuration=(Math.random()*8+6)+'s';
    p.style.animationDelay=Math.random()*5+'s';

    document.body.appendChild(p);
}
</script>

</body>
</html>
